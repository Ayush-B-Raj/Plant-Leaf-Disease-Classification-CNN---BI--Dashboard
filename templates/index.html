<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🌱 Plant Disease Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #56ab2f, #a8e063);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            background: #fff;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        h2 {
            color: #2d572c;
            font-weight: bold;
            margin-bottom: 20px;
        }
        img {
            border-radius: 10px;
            margin: 20px 0;
            max-width: 100%;
            height: auto;
            border: 3px solid #2d572c;
        }
        .btn-custom {
            background-color: #2d572c;
            color: white;
            border-radius: 25px;
            padding: 10px 25px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #1e3d1e;
            color: #fff;
        }
        p {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🌿 Plant Disease Detection</h2>
        <p class="text-muted">Upload a leaf image to detect possible diseases</p>
        
        <!-- Upload Form -->
        <form action="/predict" method="post" enctype="multipart/form-data">
            <input class="form-control" type="file" name="file" accept="image/*" required>
            <br>
            <button type="submit" class="btn btn-custom">🔍 Predict</button>
        </form>

        <!-- Show Prediction if Available -->
        {% if label %}
            <hr>
            <h3>🌱 Prediction Result</h3>
            <img src="{{ image_url }}" alt="Uploaded Leaf">
            <p><b>Predicted Class:</b> <span style="color:#2d572c;">{{ label }}</span></p>
            <p><b>Confidence:</b> {{ confidence }}%</p>
        {% endif %}
    </div>
</body>
</html>
